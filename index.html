:root{--ink:#181a1f;--mut:#5f6f6d;--line:#e3ebe9;--bg:#f2f6f5;--card:#fff;--dk:#1e2539;--pr:#445786;--pr2:#5f76b0;--am:#f5a524;--rd:#e5484d;--bl:#5b6bd6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.6 Cairo,"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;font-weight:inherit;color:inherit}
.hero{background:radial-gradient(120% 140% at 100% 0%,#5f76b0 0%,#445786 35%,#1e2539 100%);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 74px;border-radius:0 0 32px 32px}
.hero h1{margin:0;font-size:28px;letter-spacing:-.01em}
.hero p{margin:2px 0 0;opacity:.85;font-size:15px}
.wrap{max-width:680px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-52px 14px 0;position:relative}
.stat{background:var(--card);border-radius:20px;padding:14px 12px;box-shadow:0 8px 24px rgba(30,37,57,.12)}
.stat b{display:block;font-size:32px;line-height:1.1;font-weight:700}
.stat span{font-size:14px;color:var(--mut)}
.stat.ok b{color:var(--pr)}.stat.bad b{color:var(--rd)}.stat.meal b{color:#c7820a}
main{padding:18px 14px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}
.chip[aria-pressed=true]{background:var(--dk);color:#fff;border-color:var(--dk)}
.cyc{margin-top:6px;font-size:13px;color:#1e2539;background:#f7fbfa;border-radius:10px;padding:6px 10px}.tmsum.t3{grid-template-columns:1fr 1fr 1fr}.tmsum{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.tmsum>div{background:#f1f8f6;border:1px solid #cfe5e0;border-radius:12px;padding:6px 4px;text-align:center}.tmsum small{display:block;font-size:11px;color:#5b706c}.tmsum b{font-size:16px;color:#1e2539}.tmsum .no b{color:#9aa9a6}@media print{.tmsum{display:none}}
@media print{.eodw{overflow:visible!important;border-radius:0}.eodt{min-width:0!important;width:100%!important;font-size:8pt!important}.eodt th,.eodt td{padding:3px 2px!important;font-size:8pt!important}.eodt tr{break-inside:avoid}}
.eodh{margin:14px 0 6px;font-size:15px;color:#1e2539}@media print{.eodh{break-after:avoid}}
.kmsum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.kmsum>div{background:#eef7f5;border:1px solid #cfe5e0;border-radius:12px;padding:6px 4px;text-align:center}.kmsum small{display:block;font-size:11px;color:#5b706c}.kmsum b{font-size:15px;color:#1e2539}.kmsum .kmd{background:#1e2539;border-color:#1e2539}.kmsum .kmd b,.kmsum .kmd small{color:#fff}@media print{.kmsum{display:none}}
.card{background:var(--card);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 2px 14px rgba(30,37,57,.07);animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:12px}

function enc(p){var o={i:p.id,n:p.no,c:p.plate,k:p.kind,d:p.driver||'',p:p.place||'',t:p.note||'',x:p.cr,m:p.comp||''};if(p.kind==='mgr'){if(p.et)o.et=p.et;if(p.bt)o.bt=p.bt}if(p.vb){o.v=1;o.b=p.by||''}if(p.clr)o.l=p.clr;if(p.ek!==undefined&&p.ek!==null&&p.ek!==''){o.ek=p.ek;o.et=p.et}if(p.bk!==undefined&&p.bk!==null&&p.bk!==''){o.bk=p.bk;o.bt=p.bt}return'ATP1.'+b64e(JSON.stringify(o))}

function dec(txt){
 var m=String(txt).replace(/[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff\u00ad]/g,'').replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-1632)}).match(/ATP1\.([A-Za-z0-9_\-]+)/);if(!m)throw 0;
 var o=JSON.parse(b64d(m[1]));if(!o||!o.i||!o.c)throw 0;
 var p={id:clean(o.i,24),no:+o.n||0,plate:dig(o.c),kind:o.k==='svc'?'svc':'mgr',driver:clean(o.d),place:clean(o.p,120),note:clean(o.t,120),cr:clean(o.x,16),comp:clean(o.m,160)};if(p.kind==='mgr'){p.et=o.et?clean(o.et,16):undefined;p.bt=o.bt?clean(o.bt,16):undefined}if(o.v){p.vb=1;p.by=clean(o.b,60)}if(o.l&&o.v)p.clr=clean(o.l,16);
 if(o.ek!==undefined&&o.ek!==''){p.ek=+dig(o.ek);p.et=clean(o.et,16)}
 if(o.bk!==undefined&&o.bk!==''){p.bk=+dig(o.bk);p.bt=clean(o.bt,16)}
 if(!p.plate)throw 0;return p}
